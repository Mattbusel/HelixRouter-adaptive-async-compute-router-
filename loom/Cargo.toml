# Loom model checks for src/route_core.rs.
#
# A separate package so loom never enters the main crate's dependency graph and
# the model checks stay out of ordinary test runs. This package compiles the
# router's admission core (the same source file) with nothing but loom. The cfg
# is crate-specific (not plain `loom`), so it does not switch Tokio or any other
# dependency to its own loom mode.
#
#   cd loom
#   RUSTFLAGS="--cfg helixrouter_loom" cargo test --release
[package]
name = "helixrouter-loom"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
path = "src/lib.rs"

[target.'cfg(helixrouter_loom)'.dependencies]
loom = "0.7"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(helixrouter_loom)"] }

# Standalone: not part of any parent workspace.
[workspace]
