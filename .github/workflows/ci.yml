name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- rustfmt (fast gate, runs first) ------------------------------------
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --all -- --check

  # ---- primary: clippy + test + docs + release build ---------------------
  test:
    name: Build, Clippy, Test, Docs
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Clear LD_LIBRARY_PATH (avoid rustc path-join bug)
        run: echo "LD_LIBRARY_PATH=" >> $GITHUB_ENV

      - name: Build (all targets, debug)
        run: cargo build --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests (all features)
        run: cargo test --all-features --all-targets

      - name: Docs (no-deps)
        run: cargo doc --no-deps --document-private-items

      - name: Build --release
        run: cargo build --release

  # ---- MSRV: ensure crate compiles on rust-version declared in Cargo.toml -
  msrv:
    name: MSRV (1.81)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.81
      - uses: Swatinem/rust-cache@v2
      - name: Clear LD_LIBRARY_PATH (avoid rustc path-join bug)
        run: echo "LD_LIBRARY_PATH=" >> $GITHUB_ENV
      - name: Build on MSRV
        run: cargo build

  # ---- security audit -----------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked --quiet
      - name: cargo audit
        run: cargo audit

  # ---- coverage ------------------------------------------------------------
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked --quiet
      - name: cargo tarpaulin
        run: cargo tarpaulin --all-features --out Xml --engine llvm
      - uses: codecov/codecov-action@v4
        with:
          fail_ci_if_error: false

  # ---- Windows cross-platform test ----------------------------------------
  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Build (default features)
        run: cargo build --all-targets
      - name: Tests (default features)
        # --all-features is omitted on Windows: the `distributed` feature pulls in
        # the redis crate which has native TLS deps that are unreliable on Windows
        # runners.  Default features cover all non-optional functionality.
        run: cargo test --all-targets

  # ---- benchmark smoke test -----------------------------------------------
  bench-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run benchmarks (smoke -- no regression gate)
        # --test mode: runs each bench function once without measuring timing.
        # A full baseline comparison requires a persistent artifact store; this
        # step confirms the benchmarks compile and complete without panicking.
        run: cargo bench -- --test
