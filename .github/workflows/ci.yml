name: CI
on: [push, pull_request]
env:
  CARGO_TERM_COLOR: always
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check
      - run: cargo check --no-default-features --lib

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Unit tests
        run: cargo test --lib
        timeout-minutes: 15
      - name: Integration tests
        run: cargo test --test '*'
        timeout-minutes: 15
      - name: Doctests
        run: cargo test --doc
        timeout-minutes: 15

  loom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Model-check the HelixRouter admission core
        working-directory: loom
        run: cargo test --release
        env:
          RUSTFLAGS: --cfg helixrouter_loom
        timeout-minutes: 15
