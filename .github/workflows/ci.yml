name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ---- rustfmt (fast gate, runs first) ------------------------------------
  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Check formatting
        run: cargo fmt --all -- --check

  # ---- primary: build + clippy + test + docs ------------------------------
  test:
    name: Build, Clippy, Test, Docs
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build (all targets)
        run: cargo build --all-targets

      - name: Clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        run: cargo test --all-targets

      - name: Docs (no-deps, deny warnings)
        run: cargo doc --no-deps --document-private-items
        env:
          RUSTDOCFLAGS: "-D warnings"

  # ---- MSRV: ensure crate compiles on rust-version declared in Cargo.toml -
  msrv:
    name: MSRV (1.75)
    runs-on: ubuntu-latest
    needs: fmt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.75
      - uses: Swatinem/rust-cache@v2
      - name: Build on MSRV
        run: cargo build

  # ---- security audit -----------------------------------------------------
  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet
      - name: Run cargo audit
        run: cargo audit

  # ---- benchmark smoke test -----------------------------------------------
  bench-smoke:
    name: Benchmark Smoke Test
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - name: Run benchmarks (smoke -- no regression gate)
        # --test mode: runs each bench function once without measuring timing.
        # A full baseline comparison requires a persistent artifact store; this
        # step confirms the benchmarks compile and complete without panicking.
        run: cargo bench -- --test
