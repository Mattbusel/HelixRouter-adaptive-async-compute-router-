[package]
name = "helixrouter"
version = "1.1.0"
edition = "2021"
rust-version = "1.81"
description = "Adaptive async compute routing engine: per-job strategy selection (inline/spawn/pool/batch/drop) driven by live pressure, EMA latency, and online-learned quality estimates."
repository = "https://github.com/Mattbusel/HelixRouter-adaptive-async-compute-router-"
homepage = "https://github.com/Mattbusel/HelixRouter-adaptive-async-compute-router-"
documentation = "https://docs.rs/helixrouter"
license = "MIT"
keywords = ["async", "routing", "backpressure", "autoscaler", "tokio"]
categories = ["asynchronous", "concurrency", "network-programming"]
authors = ["Matt Busel <matt@example.com>"]
readme = "README.md"
exclude = ["dashboard.png", "Screenshot*", "Doc.txt", "Expand Doc.txt", "yaml", "scripts/"]

[[bin]]
name = "helixrouter"
path = "src/main.rs"

[lib]
name = "helixrouter"
path = "src/lib.rs"

[features]
default = ["simulation"]
# Enables the simulator module and its rand dependency.
# Gate with `cfg(feature = "simulation")` to exclude from pure-library builds.
simulation = ["dep:rand"]
# Enables NATS-based distributed coordination (DistributedRouter).
distributed = ["dep:async-nats"]

[dependencies]
# async runtime — core, never remove
tokio = { version = "1.37", features = ["full"] }
# web framework
axum = { version = "0.7", features = ["macros"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rng for simulation — optional, gated by the `simulation` feature
rand = { version = "0.8", optional = true }
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# cli args
clap = { version = "4", features = ["derive", "env"] }
# SSE streaming
tokio-stream = { version = "0.1", features = ["sync"] }
# futures core for stream trait
futures-core = "0.3"
# atomic temp-file writes for weight persistence
tempfile = "3"
# concurrent hash map — used by cost_model and downstream_pressure modules
dashmap = "6"
# NATS async client — optional, only compiled when the `distributed` feature is enabled
async-nats = { version = "0.37", optional = true }

[dev-dependencies]
# criterion benchmarks
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.37", features = ["full", "test-util"] }
tempfile = "3"
rand = "0.8"
proptest = "1"

[[bench]]
name = "routing"
harness = false

[profile.release]
# Maximum optimization: enable link-time optimization and single codegen unit.
lto = true
codegen-units = 1
opt-level = 3
# Strip debug symbols from release binaries to reduce binary size.
strip = "symbols"
# Abort on panic in release builds — panics in libraries should never reach production.
# Change to "unwind" if you need backtraces or if downstream code catches panics.
panic = "abort"

[profile.bench]
# Keep debug info in benchmarks so Criterion can attribute samples to source lines.
debug = true

[lints.clippy]
# Deny panicking operations in library code (test modules are exempted by `#[allow]`).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# Catch common correctness pitfalls.
large_futures = "warn"
redundant_closure_for_method_calls = "warn"
needless_pass_by_value = "warn"
semicolon_if_nothing_returned = "warn"
