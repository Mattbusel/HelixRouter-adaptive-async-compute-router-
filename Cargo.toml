[package]
name = "helixrouter"
version = "0.2.0"
edition = "2021"

[[bin]]
name = "helixrouter"
path = "src/main.rs"

[lib]
name = "helixrouter"
path = "src/lib.rs"

[features]
default = []
distributed = ["redis"]

[dependencies]
# async runtime — core, never remove
tokio = { version = "1.37", features = ["full"] }
# web framework
axum = { version = "0.7", features = ["macros"] }
# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# rng for simulation
rand = "0.8"
# logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
# cli args
clap = { version = "4", features = ["derive", "env"] }
# SSE streaming
tokio-stream = { version = "0.1", features = ["sync"] }
# futures core for stream trait
futures-core = "0.3"
# Redis for distributed mode (optional)
redis = { version = "0.24", features = ["aio", "tokio-comp"], optional = true }

[dev-dependencies]
# criterion benchmarks
criterion = { version = "0.5", features = ["html_reports"] }
tokio = { version = "1.37", features = ["full", "test-util"] }
tempfile = "3"

[[bench]]
name = "routing"
harness = false

[profile.release]
lto = true
codegen-units = 1
